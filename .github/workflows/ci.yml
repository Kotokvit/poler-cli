name: Rust CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run live regression suites (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python3 tests/test_patch_crc.py
          python3 tests/test_ergonomics.py

  release:
    name: Release Asset (${{ matrix.asset_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_src: target/release/poler
            asset_name: poler-linux-x86_64
          - os: macos-latest
            binary_src: target/release/poler
            asset_name: poler-macos-arm64
          - os: windows-latest
            binary_src: target/release/poler.exe
            asset_name: poler-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release
      - name: Prepare asset (Unix)
        if: runner.os != 'Windows'
        run: |
          cp ${{ matrix.binary_src }} ./${{ matrix.asset_name }}
          chmod +x ./${{ matrix.asset_name }}
      - name: Prepare asset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp ${{ matrix.binary_src }} ./${{ matrix.asset_name }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
