[package]
name = "poler-cli"
version = "0.97.0"
edition = "2021"
authors = ["Kotokvit / POLER Engineering Core"]
description = "Sovereign Ultra-Fast Filesystem Harvester, Grep, Zero-Copy Piece-Table Editor & AI-Agent MCP Engine"
license-file = "LICENSE"
repository = "https://github.com/poler-engine-org/poler"
keywords = ["search", "harvester", "editor", "piece-table", "mcp", "grep"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[[bin]]
name = "poler"
path = "src/main.rs"


[features]
default = []
monolithic = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
memmap2 = "0.9"
libc = "0.2"
aho-corasick = "1.1"
ignore = "0.4"
regex = "1.10"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2.7"
ed25519-dalek = "2"
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
encoding_rs = "0.8"
mobi = "0.8"
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
