[package]
name = "poler-cli"
version = "0.100.0"
edition = "2021"
authors = ["Kotokvit / POLER Engineering Core"]
description = "Sovereign Ultra-Fast Filesystem Harvester, Grep, Zero-Copy Piece-Table Editor & AI-Agent MCP Engine"
license-file = "LICENSE"
repository = "https://github.com/Kotokvit/poler-cli"
keywords = ["search", "harvester", "editor", "piece-table", "mcp", "grep"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[[bin]]
name = "poler"
path = "src/main.rs"


[features]
default = []
monolithic = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
memmap2 = "0.9"
libc = "0.2"
aho-corasick = "1.1"
ignore = "0.4"
regex = "1.10"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2.7"
ed25519-dalek = "2"
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
encoding_rs = "0.8"
mobi = "0.8"
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
tempfile = "3"
# unicode-segmentation — UAX#29 word boundaries для токенизатора chunk.rs
# (порт web::extract::web_tokenize из poler-engine).
unicode-segmentation = "1.11"
# ureq — синхронный HTTP-клиент без tokio-runtime (fetch_remote в
# archive/manifest_pack.rs: упаковка удалённых юнитов манифеста, как в poler-engine).
ureq = { version = "2.10", features = ["json"] }
# lz4_flex — чистый Rust, декомпрессия постингов на горячем пути
# (compression/lz4_hot.rs, как в poler-engine).
lz4_flex = "0.11"
# petgraph — DiGraph для K-hop графа сущностей (graph/entity_graph.rs, как в poler-engine)
petgraph = { version = "0.6", features = ["serde-1"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
